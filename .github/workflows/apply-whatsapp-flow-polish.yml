name: Apply WhatsApp flow polish

on:
  push:
    branches:
      - fix/whatsapp-flow-polish

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/whatsapp-flow-polish
          fetch-depth: 0

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Apply guarded patch
        run: python3 .github/scripts/apply_whatsapp_flow_polish.py

      - name: Validate diff
        run: git diff --check

      - name: Restore
        run: dotnet restore SenorArroz.sln

      - name: Run backend tests
        run: dotnet test SenorArroz.sln --configuration Release --no-restore

      - name: Commit verified changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm --ignore-unmatch .github/scripts/apply_whatsapp_flow_polish.py
          git rm --ignore-unmatch .github/workflows/apply-whatsapp-flow-polish.yml
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 1
          fi
          git commit -m "fix: polish WhatsApp ordering flow"
          git push origin HEAD:fix/whatsapp-flow-polish
