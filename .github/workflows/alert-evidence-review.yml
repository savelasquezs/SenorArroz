name: Alert evidence review
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/tracking-alert-evidence'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    services:
      flow-postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: flow_test
          POSTGRES_PASSWORD: flow_test
          POSTGRES_DB: flow_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U flow_test -d flow_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Finalize reviewed implementation
        run: |
          python3 - <<'PY'
          import base64, hashlib, lzma, pathlib, subprocess
          source = pathlib.Path('.automation/api-final.b64')
          raw = lzma.decompress(base64.b64decode(source.read_text().strip(), validate=True))
          assert hashlib.sha256(raw).hexdigest() == 'c14836b8fda7889364c14298182de35c9b9b7c42cfe959b358fba6bd8ee74efc'
          patch = pathlib.Path('/tmp/api-final.patch'); patch.write_bytes(raw)
          subprocess.run(['git','apply','--check','--index','--unidiff-zero',str(patch)],check=True)
          subprocess.run(['git','apply','--index','--unidiff-zero',str(patch)],check=True)
          source.unlink()
          pathlib.Path('.github/workflows/alert-evidence-review.yml').unlink()
          PY
      - name: Commit feature branch only and restore existing read-only CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git add -u
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(tracking): bound interrupted evidence and finalize alert regressions'
          AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$AUTH"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/fix/tracking-alert-evidence
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '9.0.x'
      - run: dotnet restore SenorArroz.sln
      - run: dotnet build SenorArroz.sln --configuration Release --no-restore
      - name: Full backend tests
        env:
          RUN_POSTGRES_INTEGRATION_TESTS: 'true'
          FLOW_POSTGRES_TEST_CONNECTION: 'Host=localhost;Port=5432;Database=flow_test;Username=flow_test;Password=flow_test'
        run: dotnet test SenorArroz.Tests/SenorArroz.Tests.csproj --configuration Release --no-build --logger 'console;verbosity=normal'
