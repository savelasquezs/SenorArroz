name: Alert evidence review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  sources:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/tracking-alert-evidence'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Archive tracked review sources without runtime secrets or data
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, subprocess, tarfile
          allowed = {'.cs', '.csproj', '.sln', '.props', '.targets', '.md', '.yml', '.yaml', '.sh'}
          names = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          with tarfile.open('/tmp/alert-review-source.tar.gz', 'w:gz') as archive:
              for name in names:
                  p = pathlib.Path(name)
                  if name and p.is_file() and p.suffix in allowed:
                      archive.add(p, arcname=name)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: alert-review-source
          path: /tmp/alert-review-source.tar.gz
          retention-days: 1
