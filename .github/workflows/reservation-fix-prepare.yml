name: Reservation fix isolated preparation
on:
  push:
    branches: [fix/reservation-initial-deposits-20261106]
    paths:
      - .github/workflows/reservation-fix-prepare.yml
      - scripts/reservation-fix.patch
permissions:
  contents: write
concurrency:
  group: reservation-fix-preparation
  cancel-in-progress: true
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: flow_test
          POSTGRES_PASSWORD: flow_test
          POSTGRES_DB: flow_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U flow_test -d flow_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply hash-verified reviewed patch on the feature branch only
        if: hashFiles('scripts/reservation-fix.patch') != ''
        run: |
          test "$GITHUB_REF_NAME" = fix/reservation-initial-deposits-20261106
          python3 - <<'PY'
          import base64, hashlib, pathlib, zlib
          source = pathlib.Path('scripts/reservation-fix.patch').read_text()
          expected, encoded = source.split('\n', 1)
          patch = zlib.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(patch).hexdigest() == expected
          pathlib.Path('/tmp/reservation-fix.patch').write_bytes(patch)
          PY
          git apply --index --check /tmp/reservation-fix.patch
          git apply --index /tmp/reservation-fix.patch
          git diff --cached --check
      - uses: actions/setup-dotnet@v4
        if: hashFiles('scripts/reservation-fix.patch') != ''
        with:
          dotnet-version: 9.0.x
      - name: Run isolated regression suite
        if: hashFiles('scripts/reservation-fix.patch') != ''
        env:
          RUN_POSTGRES_INTEGRATION_TESTS: 'true'
          FLOW_POSTGRES_TEST_CONNECTION: 'Host=localhost;Port=5432;Database=flow_test;Username=flow_test;Password=flow_test'
          INVOICE_TEST_POSTGRES: 'Host=localhost;Port=5432;Database=flow_test;Username=flow_test;Password=flow_test'
        run: dotnet test SenorArroz.Tests/SenorArroz.Tests.csproj --configuration Release --logger 'console;verbosity=normal'
      - name: Commit tested source changes to feature branch
        if: hashFiles('scripts/reservation-fix.patch') != ''
        run: |
          test "$GITHUB_REF_NAME" = fix/reservation-initial-deposits-20261106
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: persist reservation receipts atomically and preserve payment coverage'
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
      - name: Archive source for review
        run: git archive --format=tar --output=reservation-fix-source.tar HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: reservation-fix-source
          path: reservation-fix-source.tar
          retention-days: 1
  verify-backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    services:
      restore-test:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: restore_test
          POSTGRES_PASSWORD: isolated_test_only
          POSTGRES_DB: restore_test
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U restore_test -d restore_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Load backup credentials without logging values
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$RAILWAY_API_TOKEN"
          npm install --global @railway/cli >/dev/null
          railway link --project 5cb08ee8-0129-4d5b-aba8-60b34cfeee58 --environment production --json >/tmp/link.json
          railway variable list --json --service postgres-backup-cron --environment production >/tmp/backup-vars.json
          python3 - <<'PY'
          import json, os
          values = json.load(open('/tmp/backup-vars.json'))
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              for key in ['AWS_ACCESS_KEY_ID','AWS_SECRET_ACCESS_KEY','BUCKET','ENDPOINT','REGION']:
                  value = str(values.get(key, ''))
                  assert value and '\n' not in value, 'Missing backup setting'
                  print('::add-mask::' + value)
                  env.write(key + '=' + value + '\n')
          os.remove('/tmp/backup-vars.json')
          PY
      - name: Restore verified current backup into runner-local PostgreSQL only
        run: |
          set -euo pipefail
          docker build -t reservation-backup-verify ops/postgres-restore >/dev/null
          docker run --rm --network host \
            -e RESTORE_DATABASE_URL=postgresql://restore_test:isolated_test_only@127.0.0.1:5433/restore_test \
            -e BUCKET -e ENDPOINT -e REGION -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY \
            -e BACKUP_PREFIX=backup- -e RESTORE_BACKUP_KEY=backup-20261106-080107.dump \
            -e ALLOW_RESTORE=YES reservation-backup-verify
          echo 'Backup backup-20261106-080107.dump restored successfully in isolated runner; MainDatabase unchanged.' >> "$GITHUB_STEP_SUMMARY"
