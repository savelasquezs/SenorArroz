name: WhatsApp inbox regression check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Run existing inbox tests against isolated PostgreSQL
        env:
          RUN_POSTGRES_INTEGRATION_TESTS: 'true'
        run: dotnet test SenorArroz.Tests/SenorArroz.Tests.csproj -c Release --filter 'FullyQualifiedName~WhatsAppUnreadSummaryPerformanceTests|FullyQualifiedName~WhatsAppOperationalBranchTests'
