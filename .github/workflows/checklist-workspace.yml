name: Checklist workspace
on:
  push:
    branches: [feat/operational-checklist-20261115]
    paths: [.github/workflows/checklist-workspace.yml]
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: git archive HEAD | gzip > /tmp/checklist-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: checklist-workspace
          path: /tmp/checklist-source.tar.gz
          retention-days: 1
