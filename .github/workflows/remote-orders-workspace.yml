name: Remote orders workspace
on:
  push:
    branches: [feature/remote-order-management]
    paths: [.github/workflows/remote-orders-workspace.yml, .remote-orders-edit.py]
permissions:
  contents: write
jobs:
  workspace:
    if: github.repository == 'savelasquezs/SenorArroz' && github.ref == 'refs/heads/feature/remote-order-management'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Apply reviewed edits
        if: hashFiles('.remote-orders-edit.py') != ''
        run: python3 .remote-orders-edit.py
      - name: Source snapshot
        if: always()
        run: git ls-files -co --exclude-standard -z | tar --null -T - -czf /tmp/remote-orders-source.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: remote-orders-source
          path: /tmp/remote-orders-source.tar.gz
          retention-days: 3
      - uses: actions/setup-dotnet@v4
        if: hashFiles('.remote-orders-edit.py') != ''
        with:
          dotnet-version: 9.0.x
      - name: Build and test
        if: hashFiles('.remote-orders-edit.py') != ''
        run: |
          dotnet build SenorArroz.sln --configuration Release
          dotnet test SenorArroz.Tests/SenorArroz.Tests.csproj --configuration Release --no-build --logger 'console;verbosity=normal'
      - name: Commit validated implementation to feature branch only
        if: success() && hashFiles('.remote-orders-files.json') != ''
        run: |
          git config user.name 'Santiago Velasquez'
          git config user.email '99078707+savelasquezs@users.noreply.github.com'
          python3 - <<'PY'
          import json, subprocess
          paths = json.load(open('.remote-orders-files.json'))
          assert paths and all(not p.startswith('.github/') and not p.startswith('/') and '..' not in p.split('/') for p in paths)
          subprocess.run(['git', 'add', '--', *paths], check=True)
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          if subprocess.run(['git', 'diff', '--cached', '--quiet']).returncode:
              subprocess.run(['git', 'commit', '-m', 'feat: manage originated remote orders with resource-scoped authorization'], check=True)
              subprocess.run(['git', 'push', 'origin', 'HEAD:refs/heads/feature/remote-order-management'], check=True)
          PY
