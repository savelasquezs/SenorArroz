name: Final checklist release validation
on:
  push:
    branches: [feat/operational-checklist-20261115]
    paths: [.github/workflows/checklist-finalize.yml]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: flow_test
          POSTGRES_PASSWORD: flow_test
          POSTGRES_DB: flow_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U flow_test -d flow_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/operational-checklist-20261115
          fetch-depth: 0
      - name: Complete checklist contracts on feature branch only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('SenorArroz.Tests/TenantIsolationV2Tests.cs')
          s = p.read_text()
          assert 'Assert.Equal(114, entityTypes.Count);' in s
          assert 'Assert.Equal(113, tenantOwned.Count);' in s
          s = s.replace('Assert.Equal(114, entityTypes.Count);', 'Assert.Equal(116, entityTypes.Count);')
          s = s.replace('Assert.Equal(113, tenantOwned.Count);', 'Assert.Equal(115, tenantOwned.Count);\n        Assert.Contains(tenantOwned, x => x.ClrType == typeof(OperationalReminder));\n        Assert.Contains(tenantOwned, x => x.ClrType == typeof(OperationalReminderState));')
          p.write_text(s)
          p = Path('SenorArroz.Infrastructure/Scripts/add_operational_checklist.sql')
          s = p.read_text()
          anchor = 'CREATE INDEX IF NOT EXISTS ix_operational_reminder_state_branch'
          assert anchor in s
          s = s.replace(anchor, 'CREATE INDEX IF NOT EXISTS ix_operational_reminder_state_tenant ON public.operational_reminder_state(tenant_id);\n' + anchor)
          p.write_text(s)
          Path('.github/workflows/checklist-finalize.yml').unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add SenorArroz.Tests/TenantIsolationV2Tests.cs SenorArroz.Infrastructure/Scripts/add_operational_checklist.sql .github/workflows/checklist-finalize.yml
          git commit -m 'fix(checklist): include both entities in tenant contracts and align state index'
          git push origin HEAD:feat/operational-checklist-20261115
          git rev-parse HEAD | tee validated-sha.txt
          git merge --no-commit --no-ff origin/main
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Build
        run: dotnet build SenorArroz.sln --configuration Release
      - name: Checklist and tenant regression tests
        env:
          RUN_POSTGRES_INTEGRATION_TESTS: 'true'
          FLOW_POSTGRES_TEST_CONNECTION: 'Host=localhost;Port=5432;Database=flow_test;Username=flow_test;Password=flow_test'
        run: dotnet test SenorArroz.Tests/SenorArroz.Tests.csproj --configuration Release --no-build --filter 'FullyQualifiedName~OperationalChecklist|FullyQualifiedName~TenantIsolationV2Tests' --logger 'trx;LogFileName=checklist.trx' --results-directory TestResults
      - name: Full backend tests
        env:
          RUN_POSTGRES_INTEGRATION_TESTS: 'true'
          FLOW_POSTGRES_TEST_CONNECTION: 'Host=localhost;Port=5432;Database=flow_test;Username=flow_test;Password=flow_test'
          INVOICE_TEST_POSTGRES: 'Host=localhost;Port=5432;Database=flow_test;Username=flow_test;Password=flow_test'
        run: dotnet test SenorArroz.Tests/SenorArroz.Tests.csproj --configuration Release --no-build --logger 'trx;LogFileName=full.trx' --results-directory TestResults
      - name: Package source and evidence
        if: always()
        run: git archive --format=tar.gz -o checklist-final-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checklist-final-evidence
          path: |
            TestResults
            validated-sha.txt
            checklist-final-source.tar.gz
