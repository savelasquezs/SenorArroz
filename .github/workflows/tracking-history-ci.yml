name: Tracking history validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tracking-history-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '9.0.x'
      - name: Archive reviewed tracking sources
        run: |
          tar -czf /tmp/tracking-api-source.tar.gz SenorArroz.Application/Features/Deliverymen/Commands/RecordLocationCommand.cs SenorArroz.Tests/DeliveryWorkSessionTests.cs SenorArroz.Tests/DeliveryAutoCompletionTests.cs
      - uses: actions/upload-artifact@v4
        with:
          name: tracking-api-source
          path: /tmp/tracking-api-source.tar.gz
          retention-days: 1
      - name: Tracking regression tests
        run: dotnet test SenorArroz.Tests/SenorArroz.Tests.csproj --configuration Release --filter 'FullyQualifiedName~DeliveryWorkSessionTests|FullyQualifiedName~DeliveryAutoCompletionTests|FullyQualifiedName~DeliveryTrackingHistoryTests' --logger 'console;verbosity=normal'
